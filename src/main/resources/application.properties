spring.application.name=lisboa-pedala

# tarifario: um bloco por município (ADR-002). Valores em cêntimos de euro.
# Os 45 min grátis e os blocos de 15 min vêm do enunciado; os preços são valores de exemplo, a definir pelo grupo.
lisboapedala.tarifario.municipios.lisboa.minutos-gratis=45
lisboapedala.tarifario.municipios.lisboa.bloco-minutos=15
lisboapedala.tarifario.municipios.lisboa.preco-por-bloco-centimos=50
lisboapedala.tarifario.municipios.lisboa.preco-base-ocasional-centimos=100

# docas: diário de idempotência (ADR-003)
lisboapedala.docas.diario=dados/docas-eventos.log

# autorizacao
lisboapedala.autorizacao.qr-validade=PT5M
lisboapedala.autorizacao.sincronizacao.intervalo-ms=30000

# disponibilidade
lisboapedala.disponibilidade.limiar-bateria-baixa=20
lisboapedala.disponibilidade.reconstrucao-ms=60000
